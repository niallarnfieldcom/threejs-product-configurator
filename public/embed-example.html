<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedding the configurator</title>
  <style>
    :root { color-scheme: light; --ink: #1c1a17; --ink-2: #575149; --line: rgb(28 26 23 / 0.14); }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; background: #f6f2eb; color: var(--ink); }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 18px; margin: 0; }
    header p { color: var(--ink-2); margin: 4px 0 0; }
    .wrap { display: grid; grid-template-columns: 260px 1fr; height: calc(100dvh - 78px); }
    .controls { padding: 18px; border-right: 1px solid var(--line); overflow-y: auto; }
    h2 { font-size: 13px; margin: 18px 0 8px; }
    h2:first-child { margin-top: 0; }
    button { display: block; width: 100%; min-height: 40px; margin: 6px 0; padding: 0 12px; text-align: left; font: inherit; color: inherit;
      border: 1px solid var(--line); border-radius: 10px; background: #fffdfa; cursor: pointer; }
    button:hover { border-color: var(--ink); }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    code { font-size: 13px; background: rgb(28 26 23 / 0.07); padding: 1px 5px; border-radius: 4px; }
    pre { font-size: 12px; white-space: pre-wrap; color: var(--ink-2); }
    @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .controls { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40dvh; } }
  </style>
</head>
<body>
  <header>
    <h1>Embedding the configurator</h1>
    <p>The page on the right is the configurator in an <code>&lt;iframe&gt;</code> with <code>?embed=1</code>, which hides its own panel. This page drives it with <code>postMessage</code>.</p>
  </header>
  <div class="wrap">
    <div class="controls" id="controls">
      <p>Waiting for the configurator…</p>
    </div>
    <iframe id="configurator" title="3D configurator" allow="xr-spatial-tracking; fullscreen"></iframe>
  </div>

  <script>
    // The configurator only talks to the origin named in parentOrigin, and only
    // accepts messages from it. Here both pages share an origin.
    const iframe = document.getElementById("configurator");
    iframe.src = `./?embed=1&parentOrigin=${encodeURIComponent(location.origin)}`;
    const send = (message) => iframe.contentWindow.postMessage(message, location.origin);
    const controls = document.getElementById("controls");

    function addGroup(title, items, onPick) {
      const heading = document.createElement("h2");
      heading.textContent = title;
      controls.append(heading);
      for (const item of items) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.name || item.label;
        button.addEventListener("click", () => onPick(item));
        controls.append(button);
      }
    }

    addEventListener("message", (event) => {
      if (event.origin !== location.origin || event.source !== iframe.contentWindow) return;
      const message = event.data;
      if (message?.type === "configurator:ready") {
        controls.replaceChildren();
        for (const slot of message.slots) {
          addGroup(slot.label, slot.finishes, (finish) => send({ type: "configurator:setFinish", slot: slot.id, finish: finish.id }));
        }
        addGroup("View", message.views, (view) => send({ type: "configurator:setView", view: view.id }));
        const log = document.createElement("pre");
        log.id = "log";
        controls.append(log);
      } else if (message?.type === "configurator:change") {
        const log = document.getElementById("log");
        if (log) log.textContent = `Last change:\n${JSON.stringify(message.state, null, 2)}`;
      }
    });
  </script>
</body>
</html>
