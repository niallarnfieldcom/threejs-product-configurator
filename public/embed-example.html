<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Product Configurator — Embed example</title>
  <style>
    body { font: 15px/1.5 -apple-system, Inter, Segoe UI, sans-serif; margin: 0; background: #0e0e10; color: #eee; }
    header { padding: 18px 24px; border-bottom: 1px solid #222; }
    h1 { font-size: 18px; margin: 0; font-weight: 700; }
    p { color: #999; margin: 6px 0 0; font-size: 13px; }
    .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 0; height: calc(100vh - 70px); }
    .panel { padding: 18px; border-right: 1px solid #222; overflow-y: auto; }
    .panel h2 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #777; margin: 18px 0 8px; }
    button, input { font: inherit; }
    .row button { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 11px; border-radius: 8px;
      border: 1px solid #2a2a2e; background: #18181b; color: #ddd; cursor: pointer; font-size: 13px; }
    .row button:hover { background: #232327; }
    input[type=color] { width: 40px; height: 28px; border: 0; background: none; cursor: pointer; vertical-align: middle; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    code { background: #1c1c20; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #b9c4ff; }
  </style>
</head>
<body>
  <header>
    <h1>Embed example — 3D Product Configurator</h1>
    <p>The configurator runs in an <code>&lt;iframe&gt;</code>. Switch product / brand via URL params or live <code>postMessage</code>.</p>
  </header>
  <div class="wrap">
    <div class="panel">
      <h2>Switch product (postMessage)</h2>
      <div class="row" id="products"></div>
      <h2>Brand accent (live)</h2>
      <input type="color" id="accent" value="#cc2244">
      <h2>URL-param embed</h2>
      <p>Or just point the iframe at:<br><code>?product=ID&amp;accent=RRGGBB&amp;brand=Name</code></p>
    </div>
    <iframe id="cfg" src="/?product=lounge_chair&accent=cc2244&brand=Acme%20Interiors" allow="xr-spatial-tracking; camera; fullscreen"></iframe>
  </div>

  <script>
    const iframe = document.getElementById("cfg");
    const send = (msg) => iframe.contentWindow.postMessage(msg, "*");

    // the configurator announces itself + its catalogue
    window.addEventListener("message", (e) => {
      const m = e.data;
      if (m && m.type === "configurator:ready" && Array.isArray(m.products)) {
        const box = document.getElementById("products");
        box.innerHTML = "";
        m.products.forEach((p) => {
          const b = document.createElement("button");
          b.textContent = p.name;
          b.onclick = () => send({ type: "configurator:setProduct", product: p.id });
          box.appendChild(b);
        });
      }
    });

    document.getElementById("accent").addEventListener("input", (e) => {
      send({ type: "configurator:setAccent", accent: e.target.value });
    });
  </script>
</body>
</html>
